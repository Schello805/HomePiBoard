<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomePiBoard — Startet…</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0c0e12;
      --panel: #151921;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f3f6;
      --muted: #8b949e;
      --acid: #c9f269;
      --cyan: #41b9d2;
      --amber: #f8b679;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .ambient-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(201, 242, 105, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 75% 65%, rgba(65, 185, 210, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 25% 75%, rgba(248, 182, 121, 0.04) 0%, transparent 35%);
      z-index: 0;
    }
    .splash-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 580px;
      padding: 48px 36px;
      border-radius: 28px;
      background: rgba(21, 25, 33, 0.75);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(201, 242, 105, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeInSplash 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInSplash {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      border-radius: 36px;
      background: radial-gradient(circle, rgba(201, 242, 105, 0.3) 0%, transparent 70%);
      animation: pulseGlow 3s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    .logo-svg {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.4));
      animation: gentleFloat 4s infinite ease-in-out;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    h1.brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title span.highlight {
      color: var(--acid);
    }
    .badge-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .status-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .status-text {
      font-size: 17px;
      font-weight: 600;
      color: #e2e8f0;
      min-height: 26px;
      transition: color 0.3s ease;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--acid), var(--amber));
      animation: progressIndeterminate 1.8s infinite ease-in-out;
    }
    @keyframes progressIndeterminate {
      0% { left: -40%; width: 30%; }
      50% { left: 35%; width: 45%; }
      100% { left: 100%; width: 30%; }
    }
    .indicator-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 10px var(--acid);
      animation: pulseDot 1.4s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.7); opacity: 0.4; }
    }
    .retry-tip {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      min-height: 18px;
    }
    .fade-out {
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <div class="splash-container" id="splash-card">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <svg class="logo-svg" viewBox="0 0 720 720" role="img" aria-label="HomePiBoard Logo">
        <rect width="720" height="720" rx="44" fill="#202731"/>
        <g fill="none" stroke="#f5f7f8" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="30" d="M166 252 360 97l194 155v273c0 20-16 36-36 36H202c-20 0-36-16-36-36z"/>
          <path stroke-width="30" d="M166 252h-24l218-175 218 175h-24M244 211v-73h52"/>
        </g>
        <g fill="none" stroke-linecap="round">
          <path stroke="#41b9d2" stroke-width="29" d="M260 233v55"/>
          <path stroke="#a9dd52" stroke-width="29" d="M304 201v87"/>
          <path stroke="#2eacc8" stroke-width="29" d="M348 201h55"/>
          <path stroke="#b2e25d" stroke-width="29" d="M348 244h98"/>
          <path stroke="#f8b679" stroke-width="29" d="M348 284h98"/>
        </g>
        <circle cx="458" cy="211" r="14" fill="#f8b679"/>
        <g fill="#f5f7f8">
          <path d="M249 337v108h50v-42h36v42h49V337h-49v39h-36v-39z"/>
          <path d="M431 337h45v108h-45z"/>
          <path d="M478 412h45v33h-45z"/>
        </g>
        <g fill="#8e969f">
          <rect x="247" y="474" width="7" height="25" rx="3"/>
          <rect x="262" y="468" width="7" height="31" rx="3"/>
          <rect x="277" y="474" width="7" height="25" rx="3"/>
          <rect x="292" y="468" width="7" height="31" rx="3"/>
          <rect x="307" y="474" width="7" height="25" rx="3"/>
          <rect x="322" y="468" width="7" height="31" rx="3"/>
          <rect x="337" y="474" width="7" height="25" rx="3"/>
          <rect x="352" y="468" width="7" height="31" rx="3"/>
        </g>
      </svg>
    </div>

    <h1 class="brand-title">Home<span class="highlight">Pi</span>Board</h1>
    <div class="badge-sub">Pi Signage Dashboard</div>

    <div class="status-box">
      <div class="status-text" id="status-message">System startet …</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="indicator-row">
        <span class="live-dot" id="live-indicator"></span>
        <span id="sub-status">Dashboard ist gleich bereit</span>
      </div>
      <div class="retry-tip" id="retry-tip"></div>
    </div>
  </div>

  <script>
    (function () {
      const statusMsg = document.getElementById('status-message')
      const subStatus = document.getElementById('sub-status')
      const retryTip = document.getElementById('retry-tip')
      const splashCard = document.getElementById('splash-card')
      const liveIndicator = document.getElementById('live-indicator')

      // Target dashboard URL (defaults to localhost:4173 if launched via file://)
      const targetUrl = window.location.protocol === 'file:'
        ? 'http://localhost:4173/'
        : (window.location.origin + '/')

      let attempts = 0
      let redirected = false

      const tips = [
        'Dienste und Widgets werden vorbereitet …',
        'Netzwerkverbindung wird initialisiert …',
        'Lade Anzeigekonfiguration …',
        'Fast geschafft …'
      ]

      async function checkServer() {
        if (redirected) return
        attempts++

        if (attempts > 3) {
          const tipIndex = (Math.floor(attempts / 3) - 1) % tips.length
          retryTip.textContent = tips[tipIndex]
        }

        try {
          const testEndpoint = targetUrl + 'api/system'
          const res = await fetch(testEndpoint, {
            method: 'GET',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
          })

          if (res.ok || res.status === 200 || res.status === 404) {
            redirected = true
            statusMsg.textContent = '✓ Bereit!'
            statusMsg.style.color = '#c9f269'
            subStatus.textContent = 'Dashboard wird geladen …'
            liveIndicator.style.background = '#c9f269'
            liveIndicator.style.boxShadow = '0 0 16px #c9f269'

            setTimeout(() => {
              splashCard.classList.add('fade-out')
              setTimeout(() => {
                window.location.replace(targetUrl)
              }, 350)
            }, 300)
            return
          }
        } catch (err) {
          if (attempts === 1) {
            statusMsg.textContent = 'HomePiBoard ist gleich bereit …'
          }
        }

        setTimeout(checkServer, 800)
      }

      setTimeout(checkServer, 500)
    })()
  </script>
</body>
</html>
